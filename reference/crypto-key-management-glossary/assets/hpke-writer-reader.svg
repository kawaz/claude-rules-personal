<text x="230.0" y="74.0" text-anchor="middle" font-size="13" fill="#1a202c">受信者の公開鍵</text>
<text x="230.0" y="145.0" text-anchor="middle" font-size="13" fill="#1a202c">KEM: 使い捨ての共有鍵を作り、</text>
<text x="230.0" y="163.0" text-anchor="middle" font-size="13" fill="#1a202c">受信者だけが取り出せる形にする</text>
<text x="230.0" y="235.0" text-anchor="middle" font-size="13" fill="#1a202c">KDF: 共有鍵から</text>
<text x="230.0" y="253.0" text-anchor="middle" font-size="13" fill="#1a202c">AEAD の鍵と nonce を作る</text>
<text x="230.0" y="334.0" text-anchor="middle" font-size="13" fill="#1a202c">AEAD: データ本体を暗号化</text>
<text x="140.0" y="424.0" text-anchor="middle" font-size="13" fill="#1a202c">平文</text>
<text x="320.0" y="424.0" text-anchor="middle" font-size="13" fill="#1a202c">AAD</text>
<text x="60.0" y="47.0" text-anchor="start" font-size="12" fill="#4a5568" font-weight="bold">書き手 (受信者の公開鍵を持つ)</text>
<text x="760.0" y="74.0" text-anchor="middle" font-size="13" fill="#1a202c">受信者の秘密鍵</text>
<text x="760.0" y="154.0" text-anchor="middle" font-size="13" fill="#1a202c">KEM: 共有鍵を取り出す</text>
<text x="760.0" y="244.0" text-anchor="middle" font-size="13" fill="#1a202c">KDF: 同じ AEAD の鍵と nonce を作る</text>
<text x="760.0" y="334.0" text-anchor="middle" font-size="13" fill="#1a202c">AEAD: 復号とタグ検証</text>
<text x="670.0" y="424.0" text-anchor="middle" font-size="13" fill="#1a202c">平文</text>
<text x="850.0" y="424.0" text-anchor="middle" font-size="13" fill="#1a202c">同じ AAD</text>
<text x="600.0" y="47.0" text-anchor="start" font-size="12" fill="#4a5568" font-weight="bold">読み手 (受信者の秘密鍵を持つ)</text>
<rect x="436.0" y="131.0" width="128.0" height="38.0" fill="#ffffff" fill-opacity="0.92"/>
<text x="500.0" y="145.0" text-anchor="middle" font-size="12" fill="#2d3748">受信者だけが</text>
<text x="500.0" y="163.0" text-anchor="middle" font-size="12" fill="#2d3748">取り出せる形の共有鍵</text>
<rect x="478.0" y="320.0" width="44.0" height="20.0" fill="#ffffff" fill-opacity="0.92"/>
<text x="500.0" y="334.0" text-anchor="middle" font-size="12" fill="#2d3748">暗号文</text>
</svg>
