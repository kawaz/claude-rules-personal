<text x="120.0" y="54.0" text-anchor="middle" font-size="13" fill="#1a202c">認証なしの SE 鍵</text>
<text x="360.0" y="54.0" text-anchor="middle" font-size="13" fill="#1a202c">biometry 付きの SE 鍵</text>
<text x="600.0" y="45.0" text-anchor="middle" font-size="13" fill="#1a202c">複数の rpId に登録した</text>
<text x="600.0" y="63.0" text-anchor="middle" font-size="13" fill="#1a202c">passkey の PRF 出力</text>
<text x="840.0" y="45.0" text-anchor="middle" font-size="13" fill="#1a202c">CSPRNG のランダム値</text>
<text x="840.0" y="63.0" text-anchor="middle" font-size="13" fill="#1a202c">(印刷して保管)</text>
<text x="120.0" y="145.0" text-anchor="middle" font-size="13" fill="#1a202c">デバイス要素 D</text>
<text x="120.0" y="163.0" text-anchor="middle" font-size="13" fill="#1a202c">(ホストにしか計算できない値)</text>
<text x="360.0" y="154.0" text-anchor="middle" font-size="13" fill="#1a202c">Touch ID スロットの F</text>
<text x="600.0" y="154.0" text-anchor="middle" font-size="13" fill="#1a202c">passkey スロットの F</text>
<text x="840.0" y="154.0" text-anchor="middle" font-size="13" fill="#1a202c">リカバリキースロットの F</text>
<rect x="124.0" y="88.0" width="35.8" height="20.0" fill="#ffffff" fill-opacity="0.92"/>
<text x="128.0" y="102.0" text-anchor="start" font-size="12" fill="#2d3748">ECDH</text>
<rect x="364.0" y="88.0" width="35.8" height="20.0" fill="#ffffff" fill-opacity="0.92"/>
<text x="368.0" y="102.0" text-anchor="start" font-size="12" fill="#2d3748">ECDH</text>
<text x="360.0" y="269.0" text-anchor="middle" font-size="13" fill="#1a202c">KEK = HKDF(D ‖ F)</text>
<text x="600.0" y="269.0" text-anchor="middle" font-size="13" fill="#1a202c">KEK = HKDF(D ‖ F)</text>
<text x="840.0" y="269.0" text-anchor="middle" font-size="13" fill="#1a202c">KEK = HKDF(D ‖ F)</text>
<text x="600.0" y="364.0" text-anchor="middle" font-size="13" fill="#1a202c">全スロット共通の解錠鍵 S</text>
<text x="1060.0" y="260.0" text-anchor="middle" font-size="13" fill="#1a202c">パスフレーズの</text>
<text x="1060.0" y="278.0" text-anchor="middle" font-size="13" fill="#1a202c">Argon2id の結果</text>
<text x="1060.0" y="356.0" text-anchor="middle" font-size="13" fill="#1a202c">パスフレーズ要素 P</text>
<text x="1060.0" y="374.0" text-anchor="middle" font-size="13" fill="#1a202c">(D で暗号化して保存し、</text>
<text x="1060.0" y="392.0" text-anchor="middle" font-size="13" fill="#1a202c">発行時刻と寿命を AAD で保護)</text>
<text x="600.0" y="469.0" text-anchor="middle" font-size="13" fill="#1a202c">vault ラップ = HKDF(D ‖ S ‖ P)</text>
<text x="600.0" y="559.0" text-anchor="middle" font-size="13" fill="#1a202c">vault 秘密鍵 (X25519)</text>
<text x="600.0" y="660.0" text-anchor="middle" font-size="13" fill="#1a202c">各アイテム</text>
<text x="600.0" y="678.0" text-anchor="middle" font-size="13" fill="#1a202c">(AAD に item ID と版)</text>
<rect x="604.0" y="600.0" width="99.7" height="20.0" fill="#ffffff" fill-opacity="0.92"/>
<text x="608.0" y="614.0" text-anchor="start" font-size="12" fill="#2d3748">HPKE で読み出す</text>
<text x="250.0" y="660.0" text-anchor="middle" font-size="13" fill="#1a202c">vault 公開鍵</text>
<text x="250.0" y="678.0" text-anchor="middle" font-size="13" fill="#1a202c">(ファイルに平文で置く)</text>
<rect x="375.2" y="640.0" width="99.7" height="20.0" fill="#ffffff" fill-opacity="0.92"/>
<text x="425.0" y="654.0" text-anchor="middle" font-size="12" fill="#2d3748">HPKE で書き込む</text>
<text x="980.0" y="669.0" text-anchor="middle" font-size="13" fill="#1a202c">SE の署名鍵 K_sig (ES256)</text>
<rect x="740.0" y="640.0" width="80.0" height="20.0" fill="#ffffff" fill-opacity="0.92"/>
<text x="780.0" y="654.0" text-anchor="middle" font-size="12" fill="#2d3748">書き手の署名</text>
</svg>
