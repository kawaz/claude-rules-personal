<svg xmlns="http://www.w3.org/2000/svg" viewBox="-17 -21 1106 401" width="1106" height="401" font-family="sans-serif">
<title>secret の渡し方と置き場の選び方</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker></defs>
<rect x="-17" y="-21" width="1106" height="401" fill="#ffffff"/>
<text x="-1" y="7" font-size="15" font-weight="bold" fill="#1a202c">secret の渡し方と置き場の選び方</text>
<polygon points="383.8,34.0 536.2,34.0 550.2,50.0 536.2,66.0 383.8,66.0 369.8,50.0" fill="#fff8e6" stroke="#b7791f" stroke-width="1.4"/>
<rect x="-0.8" y="155.0" width="301.7" height="50.0" rx="6" fill="#e8f5ec" stroke="#2f855a" stroke-width="1.4"/>
<polygon points="583.0,164.0 777.0,164.0 791.0,180.0 777.0,196.0 583.0,196.0 569.0,180.0" fill="#fff8e6" stroke="#b7791f" stroke-width="1.4"/>
<rect x="323.7" y="296.0" width="292.6" height="68.0" rx="6" fill="#e8f5ec" stroke="#2f855a" stroke-width="1.4"/>
<rect x="727.2" y="305.0" width="345.6" height="50.0" rx="6" fill="#e8f5ec" stroke="#2f855a" stroke-width="1.4"/>
<path d="M369.8,50.0 L150.0,50.0 L150.0,155.0" fill="none" stroke="#4a5568" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M550.2,50.0 L680.0,50.0 L680.0,164.0" fill="none" stroke="#4a5568" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M620.0,196.0 L620.0,260.0 L470.0,260.0 L470.0,296.0" fill="none" stroke="#4a5568" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M740.0,196.0 L740.0,260.0 L900.0,260.0 L900.0,305.0" fill="none" stroke="#4a5568" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="460.0" y="54.0" text-anchor="middle" font-size="13" fill="#1a202c">secret を読むのは誰か</text>
<text x="150.0" y="175.0" text-anchor="middle" font-size="13" fill="#1a202c">1Password の op run で env に注入</text>
<text x="150.0" y="193.0" text-anchor="middle" font-size="13" fill="#1a202c">(reference の op-run-secret-injection)</text>
<text x="680.0" y="184.0" text-anchor="middle" font-size="13" fill="#1a202c">読み手を自分のコードに絞るか</text>
<text x="470.0" y="316.0" text-anchor="middle" font-size="13" fill="#1a202c">キーチェーンの generic password に置き、</text>
<text x="470.0" y="334.0" text-anchor="middle" font-size="13" fill="#1a202c">/usr/bin/security で読む (この文書)。</text>
<text x="470.0" y="352.0" text-anchor="middle" font-size="13" fill="#1a202c">守りは置く token の権限を絞って作る</text>
<text x="900.0" y="325.0" text-anchor="middle" font-size="13" fill="#1a202c">自作のバイナリが自分の身元にだけ読ませる項目</text>
<text x="900.0" y="343.0" text-anchor="middle" font-size="13" fill="#1a202c">(reference の macos-process-protection の M4)</text>
<rect x="194.0" y="24.0" width="92.0" height="20.0" fill="#ffffff" fill-opacity="0.92"/>
<text x="240.0" y="38.0" text-anchor="middle" font-size="12" fill="#2d3748">人が対話で使う</text>
<rect x="674.3" y="81.0" width="251.4" height="38.0" fill="#ffffff" fill-opacity="0.92"/>
<text x="800.0" y="95.0" text-anchor="middle" font-size="12" fill="#2d3748">ツールが無人で読む</text>
<text x="800.0" y="113.0" text-anchor="middle" font-size="12" fill="#2d3748">(launchd、定時実行、CLI の既定の読み口)</text>
<rect x="512.0" y="235.0" width="56.0" height="20.0" fill="#ffffff" fill-opacity="0.92"/>
<text x="540.0" y="249.0" text-anchor="middle" font-size="12" fill="#2d3748">絞らない</text>
<rect x="814.0" y="235.0" width="32.0" height="20.0" fill="#ffffff" fill-opacity="0.92"/>
<text x="830.0" y="249.0" text-anchor="middle" font-size="12" fill="#2d3748">絞る</text>
</svg>
