<svg xmlns="http://www.w3.org/2000/svg" viewBox="52 -22 734 604" width="734" height="604" font-family="sans-serif">
<title>署名と notarize の順序</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker></defs>
<rect x="52" y="-22" width="734" height="604" fill="#ffffff"/>
<text x="68" y="6" font-size="15" font-weight="bold" fill="#1a202c">署名と notarize の順序</text>
<rect x="213.5" y="24.0" width="233.0" height="32.0" rx="6" fill="#f4f6fa" stroke="#4a5568" stroke-width="1.4"/>
<rect x="212.1" y="90.0" width="235.9" height="50.0" rx="6" fill="#f4f6fa" stroke="#4a5568" stroke-width="1.4"/>
<polygon points="243.8,175.0 416.2,175.0 430.2,200.0 416.2,225.0 243.8,225.0 229.8,200.0" fill="#fff8e6" stroke="#b7791f" stroke-width="1.4"/>
<rect x="590.0" y="184.0" width="180.0" height="32.0" rx="6" fill="#fdecec" stroke="#c53030" stroke-width="1.4"/>
