<rect x="80.0" y="534.0" width="640.0" height="32.0" rx="6" fill="#f4f6fa" stroke="#4a5568" stroke-width="1.4"/>
<path d="M330.0,56.0 L330.0,90.0" fill="none" stroke="#4a5568" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M330.0,140.0 L330.0,175.0" fill="none" stroke="#4a5568" stroke-width="1.4" marker-end="url(#arr)"/>
