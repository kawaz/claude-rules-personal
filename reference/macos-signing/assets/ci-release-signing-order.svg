<path d="M170.0,475.0 L170.0,534.0" fill="none" stroke="#4a5568" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M470.0,475.0 L470.0,534.0" fill="none" stroke="#4a5568" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M680.0,216.0 L680.0,534.0" fill="none" stroke="#4a5568" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="330.0" y="44.0" text-anchor="middle" font-size="13" fill="#1a202c">一時 keychain に証明書を import</text>
<text x="330.0" y="110.0" text-anchor="middle" font-size="13" fill="#1a202c">codesign (bottom-up: .app なら</text>
<text x="330.0" y="128.0" text-anchor="middle" font-size="13" fill="#1a202c">内側のバイナリ → 外側の .app)</text>
<text x="330.0" y="195.0" text-anchor="middle" font-size="13" fill="#1a202c">hardened runtime の検査</text>
<text x="330.0" y="213.0" text-anchor="middle" font-size="13" fill="#1a202c">(check_hardened)</text>
<text x="680.0" y="204.0" text-anchor="middle" font-size="13" fill="#1a202c">そのファイルを消して失敗</text>
<text x="330.0" y="289.0" text-anchor="middle" font-size="13" fill="#1a202c">notarytool submit --wait</text>
<text x="330.0" y="364.0" text-anchor="middle" font-size="13" fill="#1a202c">形態</text>
<text x="170.0" y="445.0" text-anchor="middle" font-size="13" fill="#1a202c">stapler staple</text>
<text x="170.0" y="463.0" text-anchor="middle" font-size="13" fill="#1a202c">(.app に ticket を埋め込む)</text>
<text x="470.0" y="445.0" text-anchor="middle" font-size="13" fill="#1a202c">staple しない</text>
<text x="470.0" y="463.0" text-anchor="middle" font-size="13" fill="#1a202c">(Gatekeeper がオンライン検証で公証を確認)</text>
<text x="400.0" y="554.0" text-anchor="middle" font-size="13" fill="#1a202c">keychain クリーンアップ (always: 途中で失敗しても走る)</text>
<rect x="458.1" y="190.0" width="104.0" height="20.0" fill="#ffffff" fill-opacity="0.92"/>
<text x="510.1" y="204.0" text-anchor="middle" font-size="12" fill="#2d3748">条件を満たさない</text>
<rect x="351.0" y="235.0" width="32.0" height="20.0" fill="#ffffff" fill-opacity="0.92"/>
<text x="355.0" y="249.0" text-anchor="start" font-size="12" fill="#2d3748">通る</text>
<rect x="140.3" y="335.0" width="129.4" height="20.0" fill="#ffffff" fill-opacity="0.92"/>
<text x="205.0" y="349.0" text-anchor="middle" font-size="12" fill="#2d3748">A: .app バンドルあり</text>
<rect x="376.5" y="335.0" width="127.0" height="20.0" fill="#ffffff" fill-opacity="0.92"/>
<text x="440.0" y="349.0" text-anchor="middle" font-size="12" fill="#2d3748">B: bare binary のみ</text>
</svg>
