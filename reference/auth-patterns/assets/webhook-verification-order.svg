<text x="700.0" y="44.0" text-anchor="middle" font-size="13" fill="#1a202c">受信 (path か iss で sender 設定を引く)</text>
<text x="700.0" y="120.0" text-anchor="middle" font-size="13" fill="#1a202c">1. Content-Type が application/jwt、</text>
<text x="700.0" y="138.0" text-anchor="middle" font-size="13" fill="#1a202c">compact JWS として parse できる</text>
<text x="700.0" y="215.0" text-anchor="middle" font-size="13" fill="#1a202c">2. alg が algs にある、typ が専用値、kid がある</text>
<text x="700.0" y="233.0" text-anchor="middle" font-size="13" fill="#1a202c">(jku / jwk / x5u / x5c は無視)</text>
<text x="700.0" y="319.0" text-anchor="middle" font-size="13" fill="#1a202c">3. jwks_url のキャッシュに kid がある</text>
<text x="380.0" y="400.0" text-anchor="middle" font-size="13" fill="#1a202c">再取得して、もう一度引く</text>
<text x="380.0" y="418.0" text-anchor="middle" font-size="13" fill="#1a202c">(jwks_url ごとの最小 interval の内なら再取得しない)</text>
<text x="700.0" y="499.0" text-anchor="middle" font-size="13" fill="#1a202c">4. 署名が正しい</text>
<text x="700.0" y="585.0" text-anchor="middle" font-size="13" fill="#1a202c">5. now が exp より前、</text>
<text x="700.0" y="603.0" text-anchor="middle" font-size="13" fill="#1a202c">0 ≤ exp - iat ≤ 上限、nbf が無い</text>
<text x="700.0" y="685.0" text-anchor="middle" font-size="13" fill="#1a202c">6. aud が設定値と完全一致、</text>
<text x="700.0" y="703.0" text-anchor="middle" font-size="13" fill="#1a202c">iss は設定にあれば完全一致</text>
<text x="700.0" y="780.0" text-anchor="middle" font-size="13" fill="#1a202c">7. jti が未使用で、</text>
<text x="700.0" y="798.0" text-anchor="middle" font-size="13" fill="#1a202c">使用済み集合が満杯でない</text>
<text x="700.0" y="874.0" text-anchor="middle" font-size="13" fill="#1a202c">受理</text>
