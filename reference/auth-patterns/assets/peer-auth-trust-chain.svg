<text x="480.0" y="71.0" text-anchor="middle" font-size="13" fill="#1a202c">設定の endpoint リスト</text>
<text x="480.0" y="89.0" text-anchor="middle" font-size="13" fill="#1a202c">(初期状態で双方が信頼)</text>
<text x="450.0" y="286.0" text-anchor="middle" font-size="13" fill="#1a202c">CA</text>
<text x="450.0" y="304.0" text-anchor="middle" font-size="13" fill="#1a202c">(初期状態で双方が信頼)</text>
<text x="200.0" y="204.0" text-anchor="middle" font-size="13" fill="#1a202c">aud が接続してよい URL</text>
<text x="200.0" y="289.0" text-anchor="middle" font-size="13" fill="#1a202c">aud の TLS で C1 を信頼</text>
<text x="200.0" y="374.0" text-anchor="middle" font-size="13" fill="#1a202c">C1 の相手が aud</text>
<text x="80.0" y="177.0" text-anchor="start" font-size="12" fill="#4a5568" font-weight="bold">S 側</text>
<text x="790.0" y="195.0" text-anchor="middle" font-size="13" fill="#1a202c">iss が接続してよい URL</text>
<text x="790.0" y="213.0" text-anchor="middle" font-size="13" fill="#1a202c">(同時に aud が self と一致することを確認)</text>
<text x="790.0" y="289.0" text-anchor="middle" font-size="13" fill="#1a202c">iss の TLS で C2 を信頼</text>
<text x="790.0" y="364.0" text-anchor="middle" font-size="13" fill="#1a202c">C2 への信頼で jwk を信頼</text>
<text x="790.0" y="439.0" text-anchor="middle" font-size="13" fill="#1a202c">jwk と proof の検証で C1 を信頼</text>
<text x="790.0" y="514.0" text-anchor="middle" font-size="13" fill="#1a202c">C1 の相手が iss</text>
<text x="790.0" y="604.0" text-anchor="middle" font-size="13" fill="#1a202c">hello の内容 (kid、instance id)</text>
<text x="590.0" y="177.0" text-anchor="start" font-size="12" fill="#4a5568" font-weight="bold">R 側</text>
<rect x="806.0" y="545.0" width="80.0" height="20.0" fill="#ffffff" fill-opacity="0.92"/>
<text x="810.0" y="559.0" text-anchor="start" font-size="12" fill="#2d3748">遡及して信頼</text>
</svg>
