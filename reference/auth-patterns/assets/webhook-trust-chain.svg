<text x="360.0" y="334.0" text-anchor="middle" font-size="13" fill="#1a202c">endpoint が送ってよい URL</text>
<text x="650.0" y="334.0" text-anchor="middle" font-size="13" fill="#1a202c">endpoint の TLS で相手を信頼</text>
