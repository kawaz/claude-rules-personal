<svg xmlns="http://www.w3.org/2000/svg" viewBox="24 -16 1152 401" width="1152" height="401" font-family="sans-serif">
<title>生の body に detached JWS で署名する形</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker></defs>
<rect x="24" y="-16" width="1152" height="401" fill="#ffffff"/>
<text x="40" y="12" font-size="15" font-weight="bold" fill="#1a202c">生の body に detached JWS で署名する形</text>
<rect x="480" y="30" width="630" height="300" rx="8" fill="#fafbfd" stroke="#a0aec0" stroke-width="1.2" stroke-dasharray="5,4"/>
<rect x="40" y="30" width="330" height="280" rx="8" fill="#fafbfd" stroke="#a0aec0" stroke-width="1.2" stroke-dasharray="5,4"/>
<rect x="94.1" y="74.0" width="211.7" height="32.0" rx="6" fill="#f4f6fa" stroke="#4a5568" stroke-width="1.4"/>
<rect x="53.2" y="155.0" width="293.6" height="50.0" rx="6" fill="#f4f6fa" stroke="#4a5568" stroke-width="1.4"/>
<rect x="81.7" y="245.0" width="236.7" height="50.0" rx="6" fill="#f4f6fa" stroke="#4a5568" stroke-width="1.4"/>
<rect x="577.1" y="70.0" width="285.8" height="50.0" rx="6" fill="#f4f6fa" stroke="#4a5568" stroke-width="1.4"/>
<rect x="970.3" y="79.0" width="99.4" height="32.0" rx="6" fill="#f4f6fa" stroke="#4a5568" stroke-width="1.4"/>
<rect x="631.6" y="165.0" width="336.8" height="50.0" rx="6" fill="#f4f6fa" stroke="#4a5568" stroke-width="1.4"/>
<rect x="682.4" y="274.0" width="235.1" height="32.0" rx="6" fill="#e8f5ec" stroke="#2f855a" stroke-width="1.4"/>
<path d="M200.0,106.0 L200.0,155.0" fill="none" stroke="#4a5568" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M200.0,205.0 L200.0,245.0" fill="none" stroke="#4a5568" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M305.9,90.0 L577.1,90.0" fill="none" stroke="#4a5568" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M200.0,295.0 L200.0,360.0 L1160.0,360.0 L1160.0,95.0 L1069.7,95.0" fill="none" stroke="#4a5568" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M720.0,120.0 L720.0,165.0" fill="none" stroke="#4a5568" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M1020.0,111.0 L1020.0,190.0 L968.4,190.0" fill="none" stroke="#4a5568" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M800.0,215.0 L800.0,274.0" fill="none" stroke="#4a5568" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="200.0" y="94.0" text-anchor="middle" font-size="13" fill="#1a202c">1. 送る body のバイト列を確定</text>
<text x="200.0" y="175.0" text-anchor="middle" font-size="13" fill="#1a202c">2. compact JWS を作る</text>
<text x="200.0" y="193.0" text-anchor="middle" font-size="13" fill="#1a202c">protected header . payload . signature</text>
<text x="200.0" y="265.0" text-anchor="middle" font-size="13" fill="#1a202c">3. payload を空にする</text>
<text x="200.0" y="283.0" text-anchor="middle" font-size="13" fill="#1a202c">protected header . . signature</text>
<text x="50.0" y="47.0" text-anchor="start" font-size="12" fill="#4a5568" font-weight="bold">送り側 (S)</text>
<text x="720.0" y="90.0" text-anchor="middle" font-size="13" fill="#1a202c">1. 生の body (parse する前のバイト列) を</text>
<text x="720.0" y="108.0" text-anchor="middle" font-size="13" fill="#1a202c">base64url (padding なし) にする</text>
<text x="1020.0" y="99.0" text-anchor="middle" font-size="13" fill="#1a202c">header の値</text>
<text x="800.0" y="185.0" text-anchor="middle" font-size="13" fill="#1a202c">2. header の値の . . の間に差し込み、</text>
<text x="800.0" y="203.0" text-anchor="middle" font-size="13" fill="#1a202c">protected header . payload . signature に戻す</text>
<text x="800.0" y="294.0" text-anchor="middle" font-size="13" fill="#1a202c">3. 普通の compact JWS として検証</text>
<text x="490.0" y="47.0" text-anchor="start" font-size="12" fill="#4a5568" font-weight="bold">受け側 (R)</text>
<rect x="313.0" y="111.0" width="213.9" height="38.0" fill="#ffffff" fill-opacity="0.92"/>
<text x="420.0" y="125.0" text-anchor="middle" font-size="12" fill="#2d3748">4. body</text>
<text x="420.0" y="143.0" text-anchor="middle" font-size="12" fill="#2d3748">(署名した後に再シリアライズしない)</text>
<rect x="589.0" y="350.0" width="182.0" height="20.0" fill="#ffffff" fill-opacity="0.92"/>
<text x="680.0" y="364.0" text-anchor="middle" font-size="12" fill="#2d3748">専用の request header で運ぶ</text>
</svg>
