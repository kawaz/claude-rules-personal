<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 -26 905 537" width="905" height="537" font-family="sans-serif">
<title>task port の要求で、カーネル (AMFI) の判定が先、利用者の認可が後</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker></defs>
<rect x="8" y="-26" width="905" height="537" fill="#ffffff"/>
<text x="24" y="2" font-size="15" font-weight="bold" fill="#1a202c">task port の要求で、カーネル (AMFI) の判定が先、利用者の認可が後</text>
<rect x="306.1" y="20.0" width="187.8" height="50.0" rx="6" fill="#f4f6fa" stroke="#4a5568" stroke-width="1.4"/>
<polygon points="329.0,110.0 471.0,110.0 485.0,135.0 471.0,160.0 329.0,160.0 315.0,135.0" fill="#fff8e6" stroke="#b7791f" stroke-width="1.4"/>
<polygon points="37.5,225.0 302.5,225.0 316.5,250.0 302.5,275.0 37.5,275.0 23.5,250.0" fill="#fff8e6" stroke="#b7791f" stroke-width="1.4"/>
<polygon points="538.7,216.0 741.3,216.0 755.3,250.0 741.3,284.0 538.7,284.0 524.7,250.0" fill="#fff8e6" stroke="#b7791f" stroke-width="1.4"/>
<rect x="309.2" y="335.0" width="181.6" height="50.0" rx="6" fill="#e8f5ec" stroke="#2f855a" stroke-width="1.4"/>
<rect x="543.6" y="445.0" width="352.9" height="50.0" rx="6" fill="#f4f6fa" stroke="#4a5568" stroke-width="1.4"/>
<rect x="190.5" y="454.0" width="219.0" height="32.0" rx="6" fill="#fdecec" stroke="#c53030" stroke-width="1.4"/>
<path d="M400.0,70.0 L400.0,110.0" fill="none" stroke="#4a5568" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M315.0,135.0 L170.0,135.0 L170.0,225.0" fill="none" stroke="#4a5568" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M485.0,135.0 L640.0,135.0 L640.0,216.0" fill="none" stroke="#4a5568" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M110.0,275.0 L110.0,470.0 L190.5,470.0" fill="none" stroke="#4a5568" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M230.0,275.0 L230.0,360.0 L309.2,360.0" fill="none" stroke="#4a5568" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M570.0,284.0 L570.0,360.0 L490.8,360.0" fill="none" stroke="#4a5568" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M720.0,284.0 L720.0,445.0" fill="none" stroke="#4a5568" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M543.6,470.0 L409.5,470.0" fill="none" stroke="#4a5568" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="400.0" y="40.0" text-anchor="middle" font-size="13" fill="#1a202c">同じ uid のプロセスが</text>
<text x="400.0" y="58.0" text-anchor="middle" font-size="13" fill="#1a202c">対象の task port を求める</text>
<text x="400.0" y="130.0" text-anchor="middle" font-size="13" fill="#1a202c">要求する側は</text>
<text x="400.0" y="148.0" text-anchor="middle" font-size="13" fill="#1a202c">宣言済みのデバッガか</text>
<text x="170.0" y="245.0" text-anchor="middle" font-size="13" fill="#1a202c">対象は hardened runtime なし</text>
<text x="170.0" y="263.0" text-anchor="middle" font-size="13" fill="#1a202c">かつ get-task-allow あり (表の 4 行目)</text>
<text x="640.0" y="236.0" text-anchor="middle" font-size="13" fill="#1a202c">対象は hardened runtime あり</text>
<text x="640.0" y="254.0" text-anchor="middle" font-size="13" fill="#1a202c">かつ get-task-allow なし</text>
<text x="640.0" y="272.0" text-anchor="middle" font-size="13" fill="#1a202c">(満たすべき形、表の 2 行目)</text>
<text x="400.0" y="355.0" text-anchor="middle" font-size="13" fill="#1a202c">カーネル (AMFI) が断る。</text>
<text x="400.0" y="373.0" text-anchor="middle" font-size="13" fill="#1a202c">ダイアログは出ない</text>
<text x="720.0" y="465.0" text-anchor="middle" font-size="13" fill="#1a202c">カーネルを通り、taskgated と</text>
<text x="720.0" y="483.0" text-anchor="middle" font-size="13" fill="#1a202c">利用者の認可 (system.privilege.taskport) の段へ</text>
<text x="300.0" y="474.0" text-anchor="middle" font-size="13" fill="#1a202c">取れる。メモリを読み書きできる</text>
<rect x="113.9" y="108.0" width="202.2" height="20.0" fill="#ffffff" fill-opacity="0.92"/>
<text x="215.0" y="122.0" text-anchor="middle" font-size="12" fill="#2d3748">いいえ (entitlement を持たない)</text>
<rect x="584.0" y="108.0" width="32.0" height="20.0" fill="#ffffff" fill-opacity="0.92"/>
<text x="600.0" y="122.0" text-anchor="middle" font-size="12" fill="#2d3748">はい</text>
<rect x="114.0" y="350.0" width="32.0" height="20.0" fill="#ffffff" fill-opacity="0.92"/>
<text x="118.0" y="364.0" text-anchor="start" font-size="12" fill="#2d3748">はい</text>
<rect x="234.0" y="310.0" width="44.0" height="20.0" fill="#ffffff" fill-opacity="0.92"/>
<text x="238.0" y="324.0" text-anchor="start" font-size="12" fill="#2d3748">いいえ</text>
<rect x="574.0" y="310.0" width="32.0" height="20.0" fill="#ffffff" fill-opacity="0.92"/>
<text x="578.0" y="324.0" text-anchor="start" font-size="12" fill="#2d3748">はい</text>
<rect x="724.0" y="350.0" width="162.3" height="20.0" fill="#ffffff" fill-opacity="0.92"/>
<text x="728.0" y="364.0" text-anchor="start" font-size="12" fill="#2d3748">いいえ (表の 1、3、4 行目)</text>
<rect x="451.0" y="445.0" width="68.0" height="20.0" fill="#ffffff" fill-opacity="0.92"/>
<text x="485.0" y="459.0" text-anchor="middle" font-size="12" fill="#2d3748">認可がある</text>
</svg>
